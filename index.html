<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前往 DigiForensics 电子取证学习与刷题平台</title>
    <meta name="description" content="电子取证.com 专属入口，前往 DigiForensics 电子取证学习与刷题平台。">
    <link rel="canonical" href="https://www.digiforensics.cn">
    <style>
        :root {
            --bg: #f7f9fc;
            --ink: #172033;
            --muted: #6b7280;
            --blue: #2563eb;
            --blue-light: #3b82f6;
            --blue-soft: rgba(37, 99, 235, 0.10);
            --blue-hover: rgba(37, 99, 235, 0.15);
            --line: rgba(30, 64, 175, 0.14);
            --shadow: 0 24px 70px rgba(15, 23, 42, 0.08);
            --shadow-hover: 0 28px 80px rgba(15, 23, 42, 0.12);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            color: var(--ink);
            background: radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.10), transparent 28%),
                        radial-gradient(circle at 80% 30%, rgba(14, 165, 233, 0.10), transparent 26%),
                        linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            line-height: 1.5;
        }

        .redirect-card {
            width: min(520px, 100%);
            padding: 42px 38px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .redirect-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .redirect-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--blue), #38bdf8);
            pointer-events: none;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 26px;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            border: 1px solid rgba(37, 99, 235, 0.26);
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.14), rgba(14, 165, 233, 0.08));
            display: grid;
            place-items: center;
            font-weight: 800;
            color: var(--blue);
            letter-spacing: -0.05em;
            font-size: 18px;
        }

        .brand-text {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(90deg, var(--blue), #1d4ed8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tag {
            display: inline-flex;
            padding: 8px 12px;
            margin-bottom: 18px;
            color: var(--blue);
            background: var(--blue-soft);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.04em;
            border-radius: 6px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 30px;
            line-height: 1.2;
            letter-spacing: -0.04em;
            margin-bottom: 16px;
            background: linear-gradient(90deg, #1e3a8a, #1e40af);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 24px;
        }

        .target {
            margin-bottom: 30px;
            padding: 16px 20px;
            border: 1px dashed rgba(37, 99, 235, 0.28);
            background: rgba(37, 99, 235, 0.045);
            color: #1d4ed8;
            font-size: 14px;
            word-break: break-all;
            border-radius: 8px;
            font-family: "Consolas", "Monaco", monospace;
            transition: var(--transition);
        }

        .target:hover {
            background: rgba(37, 99, 235, 0.07);
            border-color: rgba(37, 99, 235, 0.4);
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 24px;
            background: linear-gradient(90deg, var(--blue-light), var(--blue));
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            border-radius: 8px;
            box-shadow: 0 12px 26px rgba(37, 99, 235, 0.24);
            border: none;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.6s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 32px rgba(37, 99, 235, 0.3);
            background: linear-gradient(90deg, #1d4ed8, #1e40af);
        }

        .btn:hover::after {
            left: 100%;
        }

        .hint {
            color: var(--muted);
            font-size: 13px;
            padding: 8px 0;
        }

        .decor {
            position: absolute;
            bottom: -20px;
            right: -20px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.06), transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        @media (max-width: 520px) {
            .redirect-card {
                padding: 32px 24px;
            }

            h1 {
                font-size: 26px;
            }

            .brand-text {
                font-size: 20px;
            }

            .btn {
                width: 100%;
                min-height: 46px;
            }

            .actions {
                gap: 12px;
            }

            .hint {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <main class="redirect-card">
        <h1>前往 DigiForensics 官方站点</h1>

        <p>
            你访问的是 <strong>电子取证.com</strong>，请点击下方按钮进入
            DigiForensics 电子取证学习与刷题平台官方站点。
        </p>

        <div class="target">
            https://www.digiforensics.cn
        </div>

        <div class="actions">
            <a class="btn" href="https://www.digiforensics.cn">立即进入平台</a>
            <span class="hint">点击按钮手动跳转</span>
        </div>

        <div class="decor"></div>
    </main>

    <!-- 移除自动跳转脚本 -->
</body>
</html>
