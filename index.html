<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiForensics | 电子取证平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 极简深色科技基底 */
        body {
            min-height: 100vh;
            font-family: "SF Mono", "Monaco", "Consolas", "Courier New", monospace;
            background-color: #0a0e1a;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* 【电子取证细节1】背景低透明度代码流 */
        .code-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-size: 12px;
            line-height: 1.8;
            color: #1e3a5f;
            opacity: 0.4;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
            word-break: break-all;
        }

        /* 核心内容容器 */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            padding: 60px 40px;
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 4px;
            background: rgba(10, 14, 26, 0.95);
            /* 极简电路板纹理阴影 */
            box-shadow: 
                0 0 0 1px rgba(34, 197, 94, 0.05),
                0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* 【电子取证细节2】终端提示符风格标题 */
        .header {
            margin-bottom: 40px;
        }

        .prompt {
            color: #22c55e;
            font-size: 14px;
            margin-bottom: 12px;
            opacity: 0.8;
        }

        .prompt::before {
            content: "// ";
            color: #64748b;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .brand-tagline {
            font-size: 14px;
            color: #64748b;
        }

        /* 【修改】更柔和的信息块，去掉突兀的蓝 */
        .info-block {
            margin-bottom: 50px;
            padding: 24px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 2px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            line-height: 1.8;
            color: #94a3b8;
        }

        /* 【修改】去掉高亮的code样式，融入文本 */
        .info-block .highlight {
            color: #e2e8f0;
            font-weight: 500;
        }

        /* 【电子取证细节4】命令行风格按钮 */
        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 52px;
            background: transparent;
            border: 1px solid #22c55e;
            color: #22c55e;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .action-btn::before {
            content: "→ ";
            margin-right: 8px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border-color: #4ade80;
        }

        .action-btn:hover::before {
            opacity: 1;
        }

        /* 底部状态条 */
        .status-bar {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(100, 116, 139, 0.2);
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #475569;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            margin-right: 6px;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            .container {
                padding: 40px 24px;
            }
            .brand-name {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景代码流 -->
    <div class="code-bg" id="codeBg"></div>

    <div class="container">
        <!-- 终端风格标题 -->
        <div class="header">
            <div class="prompt">Preparing connection...</div>
            <h1 class="brand-name">DigiForensics</h1>
            <p class="brand-tagline">电子取证学习与刷题平台</p>
        </div>

        <!-- 【修改】更温润的文案 -->
        <div class="info-block">
            欢迎来到 <span class="highlight">DigiForensics</span> 的入口站。<br><br>
            我们已为您建立好安全通道，请点击下方按钮，<br>
            即可前往专业的电子取证学习世界。
        </div>

        <!-- 【修改】更温和的按钮文案 -->
        <a href="https://www.digiforensics.cn" class="action-btn">前往学习平台</a>

        <!-- 底部状态条 -->
        <div class="status-bar">
            <span><span class="status-dot"></span>Connection Secure</span>
            <span>Ready</span>
        </div>
    </div>

    <script>
        // 简单的背景代码流生成
        const codeSnippets = [
            "import forensics", "load evidence.img", "hash.sha256()", 
            "analyze.mft()", "recover.files()", "connect.db", 
            "scan.network", "decode.base64()", "check.integrity",
            "0x7F4A9C", "01001101", "for (i=0; i<len; i++)"
        ];

        const codeBg = document.getElementById('codeBg');
        let content = '';
        for (let i = 0; i < 200; i++) {
            content += codeSnippets[Math.floor(Math.random() * codeSnippets.length)] + '   ';
        }
        codeBg.textContent = content;
    </script>
</body>
</html>
